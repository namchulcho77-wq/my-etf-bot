name: Daily-Bot

on:
  schedule:
    # 1. 한국 오후 5:30 (UTC 08:30)
    - cron: '30 8 * * *'
    # 2. 한국 오후 5:40 (UTC 08:40)
    - cron: '40 8 * * *'
    # 3. 한국 오후 6:00 (UTC 09:00)
    - cron: '0 9 * * *'
    # 4. 한국 오후 8:00 (UTC 11:00)
    - cron: '0 11 * * *'
  workflow_dispatch: # 직접 실행 버튼을 생성

# Node.js 24 강제 사용 설정 (경고 메시지 제거용)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    # 깃허브에 파일을 기록하기 위한 권한 설정
    permissions:
      contents: write

    steps:
      # 1. 깃허브 저장소의 코드를 서버로 가져옴
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 파이썬 설치
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 필요한 라이브러리 설치 (requirements.txt 파일이 있어야 함)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 파이썬 스크립트 실행
      - name: Run script
        run: python etf_screener_20260504.py # 실행할 파일명으로 수정하세요!

      # 5. 생성된 결과 파일(txt)을 저장소에 업데이트
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add . # 생성되거나 수정된 모든 파일(txt 포함) 추가
          git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
